<app-menu />

<div class="pagina">
  <div class="pagina-cabecera">
    <div>
      <h1>Niños</h1>
      <p>Niños en seguimiento</p>
    </div>
    <button class="btn btn-principal" (click)="nuevo()">+ Añadir nuevo</button>
  </div>

  <div class="tabla-caja">
  <p-table [value]="items" [paginator]="true" [rows]="10"
           [tableStyle]="{ 'min-width': '40rem' }" dataKey="id">
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Nombres</th>
        <th>Apellidos</th>
        <th>DNI</th>
        <th>Edad (meses)</th>
        <th>Comunidad</th>
        <th>Establecimiento</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.nombres }}</td>
        <td>{{ item.apellidos }}</td>
        <td>{{ item.dni }}</td>
        <td>{{ item.edad_meses }}</td>
        <td>{{ item.comunidad_nombre }}</td>
        <td>{{ item.establecimiento_nombre }}</td>
        <td>
          <button class="btn btn-editar" (click)="editar(item)">Actualizar</button>
          <button class="btn btn-borrar" (click)="eliminar(item)">Eliminar</button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="8">No hay registros.</td></tr>
    </ng-template>
  </p-table>
  </div>
</div>

<p-dialog [(visible)]="verDialogo" [modal]="true" [style]="{ width: '450px' }" header="Niños - datos">
  <div class="formulario">
    <div class="campo">
      <label>Nombres</label>
      <input type="text" [(ngModel)]="nino.nombres" />
    </div>
    <div class="campo">
      <label>Apellidos</label>
      <input type="text" [(ngModel)]="nino.apellidos" />
    </div>
    <div class="campo">
      <label>DNI</label>
      <input type="text" [(ngModel)]="nino.dni" />
    </div>
    <div class="campo">
      <label>Fecha de nacimiento</label>
      <input type="date" [(ngModel)]="nino.fecha_nacimiento" />
    </div>
    <div class="campo">
      <label>Sexo</label>
      <select [(ngModel)]="nino.sexo">
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>
    </div>
    <div class="campo">
      <label>Apoderado</label>
      <select [(ngModel)]="nino.apoderado">
        <option *ngFor="let e of apoderados" [ngValue]="e.id">{{ e.nombres + ' ' + e.apellidos }}</option>
      </select>
    </div>
    <div class="campo">
      <label>Comunidad</label>
      <select [(ngModel)]="nino.comunidad">
        <option *ngFor="let e of comunidades" [ngValue]="e.id">{{ e.nombre }}</option>
      </select>
    </div>
    <div class="campo">
      <label>Establecimiento</label>
      <select [(ngModel)]="nino.establecimiento">
        <option *ngFor="let e of establecimientos" [ngValue]="e.id">{{ e.nombre }}</option>
      </select>
    </div>
  </div>

  <ng-template #footer>
    <button class="btn btn-gris" (click)="verDialogo = false">Cancelar (no guardar)</button>
    <button class="btn btn-principal" (click)="guardar()">Guardar cambios</button>
  </ng-template>
</p-dialog>
