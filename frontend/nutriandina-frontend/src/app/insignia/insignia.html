<app-menu />

<div class="pagina">
  <div class="pagina-cabecera">
    <div>
      <h1>Insignias</h1>
      <p>Insignias por semanas de racha</p>
    </div>
    <button class="btn btn-principal" (click)="nuevo()">+ Añadir nuevo</button>
  </div>

  <div class="tabla-caja">
  <p-table [value]="items" [paginator]="true" [rows]="10"
           [tableStyle]="{ 'min-width': '40rem' }" dataKey="id">
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Semanas de racha</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.nombre }}</td>
        <td>{{ item.descripcion }}</td>
        <td>{{ item.semanas_racha }}</td>
        <td>
          <button class="btn btn-editar" (click)="editar(item)">Actualizar</button>
          <button class="btn btn-borrar" (click)="eliminar(item)">Eliminar</button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="5">No hay registros.</td></tr>
    </ng-template>
  </p-table>
  </div>
</div>

<p-dialog [(visible)]="verDialogo" [modal]="true" [style]="{ width: '450px' }" header="Insignias - datos">
  <div class="formulario">
    <div class="campo">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="insignia.nombre" />
    </div>
    <div class="campo">
      <label>Descripción</label>
      <input type="text" [(ngModel)]="insignia.descripcion" />
    </div>
    <div class="campo">
      <label>Semanas de racha</label>
      <input type="number" [(ngModel)]="insignia.semanas_racha" />
    </div>
  </div>

  <ng-template #footer>
    <button class="btn btn-gris" (click)="verDialogo = false">Cancelar (no guardar)</button>
    <button class="btn btn-principal" (click)="guardar()">Guardar cambios</button>
  </ng-template>
</p-dialog>
