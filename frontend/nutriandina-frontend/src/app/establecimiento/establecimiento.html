<app-menu />

<div class="pagina">
  <div class="pagina-cabecera">
    <div>
      <h1>Establecimientos</h1>
      <p>Centros de salud registrados</p>
    </div>
    <button class="btn btn-principal" (click)="nuevo()">+ Añadir nuevo</button>
  </div>

  <div class="tabla-caja">
  <p-table [value]="items" [paginator]="true" [rows]="10"
           [tableStyle]="{ 'min-width': '40rem' }" dataKey="id">
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Código RENIPRESS</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.codigo_renipress }}</td>
        <td>{{ item.nombre }}</td>
        <td>{{ item.direccion }}</td>
        <td>
          <button class="btn btn-editar" (click)="editar(item)">Actualizar</button>
          <button class="btn btn-borrar" (click)="eliminar(item)">Eliminar</button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="5">No hay registros.</td></tr>
    </ng-template>
  </p-table>
  </div>
</div>

<p-dialog [(visible)]="verDialogo" [modal]="true" [style]="{ width: '450px' }" header="Establecimientos - datos">
  <div class="formulario">
    <div class="campo">
      <label>Código RENIPRESS</label>
      <input type="text" [(ngModel)]="establecimiento.codigo_renipress" />
    </div>
    <div class="campo">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="establecimiento.nombre" />
    </div>
    <div class="campo">
      <label>Dirección</label>
      <input type="text" [(ngModel)]="establecimiento.direccion" />
    </div>
  </div>

  <ng-template #footer>
    <button class="btn btn-gris" (click)="verDialogo = false">Cancelar (no guardar)</button>
    <button class="btn btn-principal" (click)="guardar()">Guardar cambios</button>
  </ng-template>
</p-dialog>
